name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Python tests + linting
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: repopilot
          POSTGRES_PASSWORD: repopilot
          POSTGRES_DB: repopilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repopilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://repopilot:repopilot@localhost:5432/repopilot_test
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      # Disable LangSmith tracing in CI (no API key needed)
      LANGSMITH_TRACING: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        run: pytest --tb=short -q

  # ---------------------------------------------------------------------------
  # Frontend: lint + Vite production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (oxlint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with oxlint
        run: npx oxlint@latest .

      - name: Run frontend tests
        run: npm test

      - name: Build (production)
        run: npm run build
